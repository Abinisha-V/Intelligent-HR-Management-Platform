services:
  - type: web
    name: hr-ai-system
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          type: postgresql
          name: hr-ai-db
          property: connectionString

databases:
  - name: hr-ai-db
    databaseName: hr_ai_system
    user: hr_ai_user