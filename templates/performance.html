{% extends 'layout.html' %}
{% block content %}
<h1>Employee Performance + Attrition Prediction</h1>
<form method="post" class="mt-3">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label class="form-label">Role</label><input class="form-control" name="role" required></div>
  <div class="row">
    <div class="col-md-4 mb-3"><label class="form-label">Tasks Completed</label><input type="number" step="1" min="0" class="form-control" name="tasks_completed" required></div>
    <div class="col-md-4 mb-3"><label class="form-label">Avg Completion Time</label><input type="number" step="0.1" class="form-control" name="avg_completion_time" required></div>
    <div class="col-md-4 mb-3"><label class="form-label">Attendance (%)</label><input type="number" step="1" min="0" max="100" class="form-control" name="attendance" required></div>
    <div class="col-md-4 mb-3"><label class="form-label">Manager Rating (1-5)</label><input type="number" step="0.1" min="1" max="5" class="form-control" name="manager_rating" required></div>
    <div class="col-md-4 mb-3"><label class="form-label">Deadlines Missed</label><input type="number" step="1" min="0" class="form-control" name="deadlines_missed" required></div>
  </div>
  <button class="btn btn-success" type="submit">Run Prediction</button>
</form>
{% endblock %}
